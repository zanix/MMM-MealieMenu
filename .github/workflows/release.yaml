name: Release

# Releases are cut locally with `node --run release`, which updates CHANGELOG.md,
# bumps the version and creates the tag. Pushing that tag creates the GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v7

      # Pull this version's section out of CHANGELOG.md
      - name: 📝 Extract Release Notes
        id: extract_notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v version="$VERSION" '
            /^##? / {
              if (found) { exit }
              if (index($0, "[" version "]") || index($0, " " version " ")) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > latest_changes.md
          if [ -s latest_changes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changelog section found for $VERSION; falling back to generated notes"
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ✅ Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          bodyFile: ${{ steps.extract_notes.outputs.has_notes == 'true' && 'latest_changes.md' || '' }}
          generateReleaseNotes: ${{ steps.extract_notes.outputs.has_notes != 'true' }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
