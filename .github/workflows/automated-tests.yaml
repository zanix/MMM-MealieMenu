name: Automated Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v7

      - name: 📜 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm

      - name: 🔗 Install Dependencies
        run: npm ci

      - name: 🧹 Check Linting
        run: node --run lint

      - name: 🧪 Run Unit Tests
        run: node --run test
